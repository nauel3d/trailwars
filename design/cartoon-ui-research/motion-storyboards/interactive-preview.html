<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trail Wars — proposed motion</title>
<style>
@font-face{font-family:Fredoka;src:url(../source/fonts/FredokaOne-Regular.ttf)}*{box-sizing:border-box}body{margin:0;background:#fff9e9;color:#20334c;font:16px Arial;padding:24px}h1,h2,button,.row{font-family:Fredoka,Arial}h1{font-size:24px;margin:0 0 8px}p{line-height:1.45}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:24px 0}.tactile{border:0;padding:0;border-radius:32px;background:#20334c;color:white;cursor:pointer}.face{display:block;background:#f66b55;border:2px solid #20334c;border-radius:32px;padding:15px 25px;transform:translateY(-5px);transition:transform 115ms cubic-bezier(.2,.8,.3,1.2)}.tactile:active .face,.tactile[data-pressed=true] .face{transform:translateY(-2px);transition-duration:65ms}.tactile:focus-visible{outline:3px solid #5579d9;outline-offset:6px}.secondary{padding:12px 16px;background:transparent;border:2px solid #20334c;border-radius:12px;color:#20334c;cursor:pointer}#board{position:relative;height:252px;max-width:620px;margin:22px 0}.row{position:absolute;height:52px;left:0;right:0;display:flex;gap:16px;align-items:center;border-bottom:1px solid #ced5c7;padding:0 16px}.row.you{background:#c8e9d9;border-radius:10px}.row span:last-child{margin-left:auto}.badge{width:22px;height:22px;border:2px solid #20334c;border-radius:50%;background:var(--color)}#message{min-height:48px;font-weight:bold}small{color:#536174}.reduce .face{transition:none}label{display:flex;gap:8px;align-items:center}
</style>
<h1>A / The score race</h1><p>Local design demonstration · sample standings · no connection to Roblox.</p>
<div class="controls"><button class="tactile" id="play"><span class="face">Replay score reveal →</span></button><button class="secondary" id="skip">Skip / settle</button><label><input type="checkbox" id="reduce">Reduced motion</label><label><input type="checkbox" id="sound">Preview original local cues</label></div>
<div id="board" aria-label="Sample standings"></div><p id="message" role="status" aria-live="polite">31 + 12 = 43. Scores settle, then ranks move.</p>
<small>Press 65ms · return 115ms · score 550ms · reorder 300ms · one 150ms settle. Sound is optional. This does not demonstrate Roblox asset playback.</small>
<script>
const board=document.querySelector('#board'),message=document.querySelector('#message'),reduce=document.querySelector('#reduce'),sound=document.querySelector('#sound'),media=matchMedia('(prefers-reduced-motion: reduce)');
const racers=[{id:'orbit',name:'Orbit',before:39,total:39,c:'#5579d9'},{id:'you',name:'YOU',before:31,total:43,c:'#f66b55'},{id:'sunny',name:'Sunny',before:26,total:31,c:'#f3c653'},{id:'mint',name:'Mint',before:20,total:22,c:'#18978f'}];
let gen=0,raf=0,timers=[],animations=[];const voices=[new Audio('../../../assets/snap-audio/settle.wav'),new Audio('../../../assets/snap-audio/rank.wav')];
for(const r of racers){const el=document.createElement('div');el.className='row '+(r.id==='you'?'you':'');el.style.setProperty('--color',r.c);el.innerHTML='<b class="rank"></b><i class="badge"></i><span>'+r.name+'</span><span class="score"></span>';el.dataset.id=r.id;board.append(el);r.el=el;}
function reduced(){return reduce.checked||media.matches}function cancel(){gen++;cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];animations.forEach(a=>a.cancel());animations=[];voices.forEach(a=>{a.pause();a.currentTime=0});}
function cue(i){if(sound.checked){voices[i].currentTime=0;voices[i].play().catch(()=>{message.textContent='Local sound unavailable. Visual preview remains usable.'})}}
function order(final){return [...racers].sort((a,b)=>(final?b.total:b.before)-(final?a.total:a.before))}
function arrange(final,animate=false){order(final).forEach((r,i)=>{const to=i*61,from=parseFloat(r.el.dataset.y||to);r.el.style.transform=`translateY(${to}px)`;r.el.dataset.y=to;r.el.querySelector('.rank').textContent=i+1;r.el.querySelector('.score').textContent=final?r.total:r.before;if(animate){const a=r.el.animate([{transform:`translateY(${from}px)`},{transform:`translateY(${to}px)`}],{duration:300,easing:'cubic-bezier(.45,0,.55,1)'});animations.push(a)}})}
function settle(){cancel();arrange(true);message.textContent='YOU · #1 · 43 points. Ready for the next round.'}
function replay(){cancel();const token=gen;arrange(false);document.body.classList.toggle('reduce',reduced());if(reduced()){arrange(true);message.textContent='Reduced motion: YOU · #1 · 31 +12 =43.';return}message.textContent='Your score: 31 +12 → 43.';const start=performance.now();function tick(now){if(token!==gen)return;const t=Math.min(1,(now-start)/550),e=1-(1-t)**3;for(const r of racers)r.el.querySelector('.score').textContent=Math.round(r.before+(r.total-r.before)*e);if(t<1)raf=requestAnimationFrame(tick);else{cue(0);arrange(true,true);timers.push(setTimeout(()=>{if(token!==gen)return;cue(1);const r=racers.find(r=>r.id==='you'),y=Number(r.el.dataset.y);animations.push(r.el.animate([{transform:`translateY(${y}px)`},{transform:`translateY(${y-2}px)`},{transform:`translateY(${y}px)`}],{duration:150,easing:'ease-out'}));message.textContent='YOU move to #1. One small settle, then rest.';},300))}}raf=requestAnimationFrame(tick)}
document.querySelector('#play').onclick=replay;document.querySelector('#skip').onclick=settle;reduce.onchange=settle;media.addEventListener('change',settle);document.addEventListener('visibilitychange',()=>{if(document.hidden)settle()});window.addEventListener('pagehide',cancel);arrange(false);
</script></html>
